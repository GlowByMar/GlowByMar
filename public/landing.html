<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Elige tu Tienda</title>
    <!-- Tipografía elegante de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,500&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0b0b0b;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            color: #ffffff;
        }

        .contenedor-principal {
            text-align: center;
            padding: 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .header-section {
            margin-bottom: 40px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-weight: 500;
            letter-spacing: 4px;
            color: #ffffff;
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            text-transform: uppercase;
        }

        .header-subtitle {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #f4e8c1;
            margin: 0;
        }

        /* Contenedor de Tarjetas Showcase */
        .marcas-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            width: 100%;
        }

        /* Tarjeta con fondo fotográfico e interacción zoom */
        .tarjeta-marca {
            flex: 1;
            min-width: 290px;
            max-width: 440px;
            height: 460px;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 40px 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            transition: all 0.4s ease;
        }

        /* Capa de imagen de fondo con zoom */
        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        /* Fotos temáticas */
        .card-glow .card-bg {
            background-image: url('imagenes/landing-glow.png');
        }

        .card-volk .card-bg {
            background-image: url('https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?auto=format&fit=crop&w=800&q=80');
        }

        /* Oscurecido del fondo para legibilidad del texto */
        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0,0,0,0.15) 0%, rgba(10,10,10,0.92) 80%);
            z-index: 2;
            transition: background 0.4s ease;
        }

        .tarjeta-marca:hover .card-bg {
            transform: scale(1.1);
        }

        .tarjeta-marca:hover .card-overlay {
            background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(10,10,10,0.82) 80%);
        }

        .tarjeta-marca:hover {
            border-color: rgba(244, 232, 193, 0.5);
            box-shadow: 0 20px 45px rgba(0,0,0,0.9);
            transform: translateY(-8px);
        }

        /* Contenido sobre el fondo */
        .card-content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .nombre-marca {
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            font-family: 'Playfair Display', serif;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .sub-marca {
            color: #f4e8c1;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: -5px;
            font-weight: 500;
        }

        .btn-enter {
            width: 100%;
            max-width: 200px;
            padding: 12px 0;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tarjeta-marca:hover .btn-enter {
            background: #f4e8c1;
            color: #0b0b0b;
            border-color: #f4e8c1;
            box-shadow: 0 5px 15px rgba(244, 232, 193, 0.3);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            background-color: #0b0b0b;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .footer-titulo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #f4e8c1;
            margin-bottom: 18px;
        }

        .footer-redes {
            display: flex;
            justify-content: center;
            gap: 28px;
            align-items: center;
            margin-bottom: 18px;
        }

        .footer-redes a {
            color: #e5d3b3;
            font-size: 24px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .footer-redes a:hover {
            transform: translateY(-4px) scale(1.1);
            color: #ffffff;
            filter: drop-shadow(0px 4px 10px rgba(244, 232, 193, 0.5));
        }

        .footer-copy {
            font-size: 10px;
            color: #777777;
            margin: 0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <div class="header-section">
            <h1>ELIGE TU ESTILO, VIVE TU ESENCIA</h1>
            <p class="header-subtitle">Dos universos, una sola experiencia</p>
        </div>
        
        <div class="marcas-container">
            
            <!-- Tarjeta Showcase 1: Glow by Mar -->
            <a href="/glow" class="tarjeta-marca card-glow">
                <div class="card-bg"></div>
                <div class="card-overlay"></div>
                <div class="card-content">
                    <span class="nombre-marca">Glow by Mar</span>
                    <span class="sub-marca">Accesorios & Joyería</span>
                    
                </div>
            </a>
            
            <!-- Tarjeta Showcase 2: VOLK -->
            <a href="/volk" class="tarjeta-marca card-volk">
                <div class="card-bg"></div>
                <div class="card-overlay"></div>
                <div class="card-content">
                    <span class="nombre-marca">Volk</span>
                    <span class="sub-marca">Moda Circular & Estilo</span>
                    
                </div>
            </a>

        </div>
    </div>

    <!-- PIE DE PÁGINA -->
    <footer>
        <p class="footer-titulo">
            Conéctate con Glow By Mar 
        </p>

        <div class="footer-redes">
            <a href="https://instagram.com/glowbymaraccesorios?utm_source=qr" target="_blank" title="Instagram">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="https://www.tiktok.com/@glowbymar11?r=1&_t=ZS-98XJfT1c4KV" target="_blank" title="TikTok">
                <i class="fab fa-tiktok"></i>
            </a>
            <a href="https://wa.me/573164457177?text=Hola!%20Vengo%20de%20la%20tienda%20Glow%20y%20me%20gustaría%20recibir%20asesoría" target="_blank" title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
            <a href="https://www.facebook.com/share/1DDCCwaQHv/?mibextid=wwXIfr/" target="_blank" title="Facebook">
                <i class="fab fa-facebook"></i>
            </a>
        </div>

        <p class="footer-copy">
            &copy; 2023 GLOW BY MAR - Todos los derechos reservados.
        </p>
    </footer>

</body>
</html>
